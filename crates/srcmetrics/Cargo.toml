[package]
name = "srcmetrics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["development-tools"]
description = "Language-independent source code metrics (size, complexity, nesting, Halstead, duplication, dependencies, documentation) for C, C++, Go, Java, JavaScript, Python, Rust and TypeScript"
readme = "../../README.md"
# Integration tests use fixtures from the repository root, which are not packaged.
exclude = ["tests"]

[dependencies]
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-cpp = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
csv = "1"
ignore = "0.4"
time = { version = "0.3", features = ["formatting"] }
