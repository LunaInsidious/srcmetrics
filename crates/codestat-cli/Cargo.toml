[package]
name = "codestat-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codestat"
path = "src/main.rs"

[dependencies]
codestat = { path = "../codestat" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
