[package]
name = "srcmetrics-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["development-tools", "command-line-utilities"]
description = "Command-line tool and local HTTP API for srcmetrics: analyze source code, export metrics as JSON/CSV, statistics and HTML reports"
readme = "../../README.md"
# Integration tests use fixtures from the repository root, which are not packaged.
exclude = ["tests"]

[[bin]]
name = "srcmetrics"
path = "src/main.rs"

[dependencies]
srcmetrics = { path = "../srcmetrics", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
